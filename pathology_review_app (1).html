                    'Squamous Cell Carcinoma in situ; risk of esophageal varices',

                correctAnswer: 1,
                explanation: 'In Sarcoidosis, activated epithelioid macrophages inside non-caseating granulomas express 1-alpha-hydroxylase, converting 25-OH Vitamin D to active 1,25-(OH)2 Vitamin D3 independent of PTH regulation, causing hypercalcemia and hypercalciuria.'

                pathologyDescription: 'Grossly, the pancreas appears swollen with areas of chalky-white fat necrosis. Microscopically, enzymatic auto-digestion of pancreatic parenchyma with neutrophil infiltration, saponification of peri-pancreatic adipose tissue, and vessel thrombosis is observed.',

        // Main App Component
        function PathologyApp() {

            const [selectedOption, setSelectedOption] = useState(null);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [quizScore, setQuizScore] = useState(0);

            const [isFlipped, setIsFlipped] = useState(false);

            const [activeCaseId, setActiveCaseId] = useState(CASE_VIGNETTES[0].id);

                }

                                          topic.keyConcepts.some(c => c.toLowerCase().includes(searchQuery.toLowerCase()));

                                    <i className={`fa-solid ${tab.icon}`}></i>

                                                                <i className="fa-solid fa-check text-emerald-500 mt-0.5"></i>

                                            </div>

                                                <span><i className="fa-solid fa-stethoscope mr-1"></i> {topic.clinicalCorrelation}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: INTERACTIVE QUIZ */}
                        {activeTab === 'quiz' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                                    <div className="bg-indigo-900 text-white p-6 flex justify-between items-center">
                                        <div>
                                            <span className="text-xs text-indigo-300 font-semibold uppercase">Board-Style Practice Question</span>
                                            <h3 className="text-lg font-bold">Question {quizIndex + 1} of {QUIZ_QUESTIONS.length}</h3>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-2xl font-black text-indigo-300">{quizScore}</span>
                                            <span className="text-xs text-indigo-200 block">Score</span>
                                        </div>
                                    </div>

                                    <div className="p-6 space-y-6">
                                        <div className="text-xs font-semibold text-indigo-600 uppercase bg-indigo-50 inline-block px-2.5 py-1 rounded">
                                            {QUIZ_QUESTIONS[quizIndex].category}
                                        </div>

                                        <p className="text-slate-800 text-base leading-relaxed font-medium">
                                            {QUIZ_QUESTIONS[quizIndex].question}
                                        </p>

                                        <div className="space-y-3">
                                            {QUIZ_QUESTIONS[quizIndex].options.map((opt, idx) => {
                                                let btnClass = "w-full text-left p-4 rounded-xl border text-sm font-medium transition flex items-center justify-between ";
                                                if (isSubmitted) {
                                                    if (idx === QUIZ_QUESTIONS[quizIndex].correctAnswer) {
                                                        btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                                                    } else if (idx === selectedOption) {
                                                        btnClass += "bg-rose-50 border-rose-500 text-rose-900";
                                                    } else {
                                                        btnClass += "bg-slate-50 border-slate-200 text-slate-400";
                                                    }
                                                } else {
                                                    if (selectedOption === idx) {
                                                        btnClass += "bg-indigo-50 border-indigo-500 text-indigo-900 shadow-sm";
                                                    } else {
                                                        btnClass += "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
                                                    }
                                                }

                                                return (
                                                    <button
                                                        key={idx}
                                                        disabled={isSubmitted}
                                                        onClick={() => setSelectedOption(idx)}
                                                        className={btnClass}
                                                    >
                                                        <span>{opt}</span>
                                                        {isSubmitted && idx === QUIZ_QUESTIONS[quizIndex].correctAnswer && (
                                                            <i className="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                                                        )}
                                                        {isSubmitted && selectedOption === idx && idx !== QUIZ_QUESTIONS[quizIndex].correctAnswer && (
                                                            <i className="fa-solid fa-circle-xmark text-rose-500 text-lg"></i>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {isSubmitted && (
                                            <div className="bg-slate-900 text-slate-100 p-4 rounded-xl text-sm space-y-2">
                                                <h5 className="font-bold text-indigo-400 flex items-center space-x-2">
                                                    <i className="fa-solid fa-lightbulb"></i>
                                                    <span>Explanation</span>
                                                </h5>
                                                <p className="text-slate-300">{QUIZ_QUESTIONS[quizIndex].explanation}</p>
                                            </div>
                                        )}

                                        <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                            {!isSubmitted ? (
                                                <button
                                                    disabled={selectedOption === null}
                                                    onClick={() => {
                                                        setIsSubmitted(true);
                                                        if (selectedOption === QUIZ_QUESTIONS[quizIndex].correctAnswer) {
                                                            setQuizScore(s => s + 10);
                                                        }
                                                    }}
                                                    className="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
                                                >
                                                    Submit Answer
                                                </button>
                                            ) : (
                                                <button
                                                    onClick={() => {
                                                        setIsSubmitted(false);
                                                        setSelectedOption(null);
                                                        setQuizIndex((quizIndex + 1) % QUIZ_QUESTIONS.length);
                                                    }}
                                                    className="w-full sm:w-auto px-6 py-2.5 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800 transition flex items-center justify-center space-x-2"
                                                >
                                                    <span>Next Question</span>
                                                    <i className="fa-solid fa-arrow-right"></i>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: FLASHCARDS */}
                        {activeTab === 'cards' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                <div className="text-center">
                                    <h2 className="text-2xl font-bold text-slate-800">Histology & Pathology Identification</h2>
                                    <p className="text-sm text-slate-500">Click card to flip and review diagnosis & key findings.</p>
                                </div>

                                {/* Flip Card */}
                                <div className="card-flip-container h-80 w-full cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                                    <div className={`card-flip-inner relative w-full h-full ${isFlipped ? 'card-flipped' : ''}`}>
                                        {/* Front */}
                                        <div className="card-front bg-white border-2 border-indigo-200 rounded-2xl shadow-lg p-8 flex flex-col justify-between items-center text-center">
                                            <span className="text-xs font-bold uppercase tracking-wide bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">
                                                {FLASHCARDS[cardIndex].system}
                                            </span>
                                            
                                            <div className="space-y-4 my-auto">
                                                <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                                    <i className={`fa-solid ${FLASHCARDS[cardIndex].imagePlaceholder}`}></i>
                                                </div>
                                                <h3 className="text-xl font-bold text-slate-800">{FLASHCARDS[cardIndex].question}</h3>
                                            </div>

                                            <span className="text-xs text-slate-400 font-semibold flex items-center space-x-1">
                                                <i className="fa-solid fa-rotate-right"></i>
                                                <span>Click to reveal answer</span>
                                            </span>
                                        </div>

                                        {/* Back */}
                                        <div className="card-back bg-slate-900 text-white rounded-2xl shadow-lg p-8 flex flex-col justify-between">
                                            <div>
                                                <span className="text-xs text-emerald-400 font-bold uppercase tracking-wider block mb-2">Diagnosis</span>
                                                <h3 className="text-2xl font-black text-white mb-4">{FLASHCARDS[cardIndex].answer}</h3>
                                                
                                                <div className="space-y-2">
                                                    <h4 className="text-xs font-bold text-slate-400 uppercase">Diagnostic Features:</h4>
                                                    <ul className="space-y-1.5">
                                                        {FLASHCARDS[cardIndex].keyFeatures.map((feat, idx) => (
                                                            <li key={idx} className="text-xs text-slate-300 flex items-start space-x-2">
                                                                <i className="fa-solid fa-circle-check text-emerald-400 mt-0.5"></i>
                                                                <span>{feat}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>

                                            <div className="text-xs text-slate-400 text-right">
                                                <span>Card {cardIndex + 1} of {FLASHCARDS.length}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Navigation */}
                                <div className="flex items-center justify-between">
                                    <button
                                        onClick={() => {
                                            setIsFlipped(false);
                                            setCardIndex((cardIndex - 1 + FLASHCARDS.length) % FLASHCARDS.length);
                                        }}
                                        className="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 hover:bg-slate-50 shadow-sm"
                                    >
                                        <i className="fa-solid fa-chevron-left mr-2"></i> Previous
                                    </button>

                                    <span className="text-xs text-slate-500 font-semibold">
                                        {cardIndex + 1} / {FLASHCARDS.length}
                                    </span>

                                    <button
                                        onClick={() => {
                                            setIsFlipped(false);
                                            setCardIndex((cardIndex + 1) % FLASHCARDS.length);
                                        }}
                                        className="px-4 py-2 bg-indigo-600 rounded-lg text-sm font-semibold text-white hover:bg-indigo-700 shadow-sm"
                                    >
                                        Next <i className="fa-solid fa-chevron-right ml-2"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: CASE VIGNETTES */}
                        {activeTab === 'cases' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {/* Case Selection Side Bar */}
                                <div className="space-y-3">
                                    <h3 className="font-bold text-slate-800 text-sm uppercase tracking-wide">Clinical Vignettes</h3>
                                    {CASE_VIGNETTES.map(c => (
                                        <button
                                            key={c.id}
                                            onClick={() => setActiveCaseId(c.id)}
                                            className={`w-full text-left p-4 rounded-xl border transition ${
                                                activeCaseId === c.id
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow'
                                                    : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300'
                                            }`}
                                        >
                                            <h4 className="font-bold text-sm">{c.title}</h4>
                                            <p className={`text-xs mt-1 line-clamp-2 ${activeCaseId === c.id ? 'text-indigo-100' : 'text-slate-500'}`}>
                                                {c.patientInfo}
                                            </p>
                                        </button>
                                    ))}
                                </div>

                                {/* Active Case Details */}
                                {(() => {
                                    const currentCase = CASE_VIGNETTES.find(c => c.id === activeCaseId);
                                    if (!currentCase) return null;

                                    return (
                                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
                                            <div>
                                                <h2 className="text-2xl font-bold text-slate-800">{currentCase.title}</h2>
                                                <p className="text-sm text-slate-600 mt-1">{currentCase.patientInfo}</p>
                                            </div>

                                            {/* Lab Results Table */}
                                            <div className="space-y-2">
                                                <h4 className="text-xs font-bold text-slate-400 uppercase">Laboratory & Vital Findings</h4>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-xs text-left border-collapse">
                                                        <thead>
                                                            <tr className="bg-slate-50 text-slate-500 border-b border-slate-200">
                                                                <th className="p-2">Test</th>
                                                                <th className="p-2">Value</th>
                                                                <th className="p-2">Reference Range</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {currentCase.labs.map((lab, i) => (
                                                                <tr key={i} className="border-b border-slate-100">
                                                                    <td className="p-2 font-medium">{lab.test}</td>
                                                                    <td className={`p-2 font-bold ${lab.status === 'high' ? 'text-rose-600' : lab.status === 'low' ? 'text-amber-600' : 'text-slate-700'}`}>
                                                                        {lab.value}
                                                                    </td>
                                                                    <td className="p-2 text-slate-400">{lab.range}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>

                                            {/* Pathology Findings */}
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-1">
                                                <h4 className="text-xs font-bold text-indigo-600 uppercase">Pathology Description</h4>
                                                <p className="text-xs text-slate-700 leading-relaxed">{currentCase.pathologyDescription}</p>
                                            </div>

                                            {/* Interactive Case Questions */}
                                            <div className="space-y-4">
                                                <h4 className="text-sm font-bold text-slate-800">Case Diagnostic Questions</h4>
                                                {currentCase.questions.map((q, qIdx) => {
                                                    const key = `${currentCase.id}-${qIdx}`;
                                                    const userAns = caseAnswers[key];

                                                    return (
                                                        <div key={qIdx} className="bg-slate-50 p-4 rounded-xl space-y-3">
                                                            <p className="text-xs font-bold text-slate-800">{qIdx + 1}. {q.q}</p>
                                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                                {q.options.map((opt, oIdx) => (
                                                                    <button
                                                                        key={oIdx}
                                                                        onClick={() => setCaseAnswers({ ...caseAnswers, [key]: oIdx })}
                                                                        className={`p-2.5 text-xs text-left rounded-lg border transition ${
                                                                            userAns === oIdx
                                                                                ? oIdx === q.answer
                                                                                    ? 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold'
                                                                                    : 'bg-rose-100 border-rose-500 text-rose-900 font-bold'
                                                                                : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                                                                        }`}
                                                                    >
                                                                        {opt}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                            {userAns !== undefined && (
                                                                <p className="text-xs text-slate-600 bg-white p-2.5 rounded border border-slate-200 mt-2">
                                                                    <strong className="text-indigo-600">Explanation: </strong>
                                                                    {q.explanation}
                                                                </p>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            {/* Key Takeaway Banner */}
                                            <div className="bg-indigo-900 text-white p-4 rounded-xl space-y-1">
                                                <h5 className="text-xs font-bold text-indigo-300 uppercase">Diagnosis & Clinical Pearl</h5>
                                                <h4 className="font-bold text-base">{currentCase.finalDiagnosis}</h4>
                                                <p className="text-xs text-slate-300 leading-relaxed">{currentCase.teachingPoint}</p>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
                        <p>© 2026 PathoMaster Review Platform. Designed for Medical Education & Board Preparation.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<PathologyApp />);
    </script>
</body>
</html>
