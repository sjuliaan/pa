    // --- API Helper Function ---
    // Uses gemini-3-flash-preview for structured JSON generation
    const generateContentFromGemini = async (prompt, schema) => {
      const apiKey = ""; // Left empty as per environment rules; injected at runtime or prompt user if needed
      if (!apiKey) {
        console.warn("Gemini API key is empty. Please set your API key in the script or environment.");
      }
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: schema
        }
      };

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if (result.candidates && result.candidates.length > 0) {
          const text = result.candidates[0].content.parts[0].text;
          return JSON.parse(text);
        }
        throw new Error("Failed to generate content");
      } catch (error) {
        console.error("Gemini API Error:", error);
        return null;
      }
    };

          description: "List of quiz questions",

            type: "OBJECT",
            properties: {
              question: { type: "STRING" },
              options: { 
                type: "ARRAY", 
                items: { type: "STRING" },

              correctAnswer: { type: "STRING", description: "Must exactly match one of the options" },
              explanation: { type: "STRING", description: "Brief explanation of why the answer is correct" }

            required: ["question", "options", "correctAnswer", "explanation"]
          }
        };

        setLoading(false);

        setAnswers({ ...answers, [currentIdx]: ans });

        });
        return score;

                  <span className="flex items-center"><RefreshCw className="animate-spin w-5 h-5 mr-2" /> Generating via Gemini...</span>
                ) : (
                  "Generate & Start Quiz"
                )}
              </button>
              {loading && <p className="text-xs text-slate-400 mt-3">Please wait, AI is composing a structured {setup.count}-item quiz. This may take a moment.</p>}
            </div>
          </div>
        );
      }

      if (showResults) {
        const score = calculateScore();
        const percent = Math.round((score / questions.length) * 100);
        return (
          <div className="h-full overflow-y-auto bg-slate-50 p-6">
            <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">
              <div className="text-center border-b pb-6 mb-6">
                <h2 className="text-3xl font-bold text-slate-800">Quiz Completed!</h2>
                <div className="mt-4 flex items-center justify-center">
                  <div className="w-32 h-32 rounded-full border-8 border-teal-100 flex items-center justify-center relative">
                    <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                      <circle cx="64" cy="64" r="56" stroke="currentColor" strokeWidth="8" fill="transparent" className="text-teal-100" />
                      <circle cx="64" cy="64" r="56" stroke="currentColor" strokeWidth="8" fill="transparent" strokeDasharray="351.8" strokeDashoffset={351.8 - (351.8 * percent) / 100} className="text-teal-500 transition-all duration-1000 ease-out" />
                    </svg>
                    <span className="text-3xl font-bold text-teal-600">{percent}%</span>
                  </div>
                </div>
                <p className="text-lg text-slate-600 mt-4">You scored {score} out of {questions.length}</p>
              </div>

              <div className="space-y-6">
                {questions.map((q, idx) => (
                  <div key={idx} className={`p-5 rounded-xl border ${answers[idx] === q.correctAnswer ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                    <p className="font-semibold text-slate-800">Q{idx + 1}: {q.question}</p>
                    <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {q.options.map((opt, i) => (
                        <div key={i} className={`p-2 text-sm rounded ${opt === q.correctAnswer ? 'bg-green-200 font-bold text-green-900' : (answers[idx] === opt ? 'bg-red-200 text-red-900 line-through' : 'bg-white text-slate-600')}`}>
                          {opt} {opt === q.correctAnswer && <CheckCircle className="inline w-4 h-4 ml-1"/>}
                          {answers[idx] === opt && opt !== q.correctAnswer && <XCircle className="inline w-4 h-4 ml-1"/>}
                        </div>
                      ))}
                    </div>
                    <div className="mt-4 p-3 bg-white bg-opacity-60 rounded text-sm text-slate-700">
                      <strong>Explanation:</strong> {q.explanation}
                    </div>
                  </div>
                ))}
              </div>

              <button 
                onClick={() => { setSetup({ ...setup, active: false }); setAnswers({}); setCurrentIdx(0); setShowResults(false); }}
                className="mt-8 w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-all"
              >
                Create New Quiz
              </button>
            </div>
          </div>
        );
      }

      const currentQ = questions[currentIdx];

      return (
        <div className="h-full flex flex-col bg-slate-50 p-4 md:p-8">
          <div className="max-w-3xl w-full mx-auto flex-1 flex flex-col">
            <div className="flex justify-between items-center mb-6">
              <span className="text-sm font-semibold text-slate-500 uppercase tracking-wider">
                {setup.module === 7 ? 'Mod 7' : 'Mod 8'} • {setup.type === 'tf' ? 'True/False' : 'MCQ'}
              </span>
              <span className="px-3 py-1 bg-teal-100 text-teal-800 font-bold rounded-full text-sm">
                Question {currentIdx + 1} of {questions.length}
              </span>
            </div>

            <div className="w-full bg-slate-200 h-2 rounded-full mb-8 overflow-hidden">
              <div className="bg-teal-500 h-full transition-all duration-300" style={{ width: `${((currentIdx + 1) / questions.length) * 100}%` }}></div>
            </div>

            <div className="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col">
              <h3 className="text-xl md:text-2xl font-semibold text-slate-800 mb-8 leading-relaxed">
                {currentQ.question}
              </h3>

              <div className="space-y-3 mt-auto">
                {currentQ.options.map((opt, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSelectAnswer(opt)}
                    className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ${
                      answers[currentIdx] === opt 
                        ? 'border-teal-500 bg-teal-50 text-teal-900 shadow-md' 
                        : 'border-slate-100 bg-slate-50 hover:bg-slate-100 hover:border-slate-300 text-slate-700'
                    }`}
                  >
                    <span className="font-medium">{String.fromCharCode(65 + idx)}.</span> {opt}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex justify-between mt-6">
              <button
                onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                disabled={currentIdx === 0}
                className={`px-6 py-3 rounded-xl font-bold flex items-center ${currentIdx === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-white text-slate-700 hover:bg-slate-100 shadow-sm'}`}
              >
                <ChevronLeft className="w-5 h-5 mr-1" /> Previous
              </button>
              
              {currentIdx === questions.length - 1 ? (
                 <button
                  onClick={() => setShowResults(true)}
                  disabled={!answers[currentIdx]}
                  className={`px-8 py-3 rounded-xl font-bold flex items-center shadow-md ${!answers[currentIdx] ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-teal-600 hover:bg-teal-700 text-white'}`}
               >
                 Finish Quiz <CheckCircle className="w-5 h-5 ml-2" />
               </button>
              ) : (
                <button
                  onClick={() => setCurrentIdx(prev => Math.min(questions.length - 1, prev + 1))}
                  disabled={!answers[currentIdx]}
                  className={`px-6 py-3 rounded-xl font-bold flex items-center shadow-sm ${!answers[currentIdx] ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-900 text-white'}`}
                >
                  Next <ChevronRight className="w-5 h-5 ml-1" />
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const FlashcardSimulator = () => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const handleNext = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex((prev) => (prev + 1) % flashcardsData.length);
        }, 150); // wait for flip animation to revert
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex((prev) => (prev - 1 + flashcardsData.length) % flashcardsData.length);
        }, 150);
      };

      const card = flashcardsData[currentIndex];

      return (
        <div className="flex flex-col items-center justify-center h-full bg-slate-50 p-6">
          <div className="mb-8 text-center">
            <h2 className="text-3xl font-extrabold text-slate-800 flex items-center justify-center">
              <Search className="w-8 h-8 mr-3 text-teal-600"/> Practical Identification
            </h2>
            <p className="text-slate-500 mt-2">Identify the pathology based on gross or microscopic characteristics.</p>
          </div>

          <div 
            className="w-full max-w-2xl h-80 perspective-1000 cursor-pointer"
            onClick={() => setIsFlipped(!isFlipped)}
          >
            <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
              
              {/* Front of Card (Description) */}
              <div className="absolute w-full h-full backface-hidden bg-white border-2 border-slate-200 rounded-3xl shadow-xl p-8 flex flex-col justify-center items-center text-center">
                <span className="absolute top-6 right-6 px-3 py-1 bg-teal-100 text-teal-800 text-xs font-bold uppercase rounded-full tracking-wide">
                  {card.module}
                </span>
                <Search className="w-12 h-12 text-slate-200 absolute top-6 left-6" />
                <h3 className="text-lg md:text-xl font-medium text-slate-700 leading-relaxed">
                  {card.description}
                </h3>
                <p className="absolute bottom-6 text-sm text-slate-400 animate-pulse">Tap to reveal diagnosis</p>
              </div>

              {/* Back of Card (Answer) */}
              <div className="absolute w-full h-full backface-hidden bg-teal-600 rounded-3xl shadow-xl p-8 flex flex-col justify-center items-center text-center rotate-y-180">
                <h2 className="text-3xl md:text-4xl font-black text-white">
                  {card.answer}
                </h2>
              </div>
            </div>
          </div>

          <div className="flex items-center mt-10 space-x-6">
            <button onClick={handlePrev} className="p-4 rounded-full bg-white shadow-md hover:bg-slate-100 text-slate-700 transition-colors">
              <ChevronLeft className="w-6 h-6" />
            </button>
            <span className="font-medium text-slate-500">
              Card {currentIndex + 1} of {flashcardsData.length}
            </span>
            <button onClick={handleNext} className="p-4 rounded-full bg-white shadow-md hover:bg-slate-100 text-slate-700 transition-colors">
              <ChevronRight className="w-6 h-6" />
            </button>
          </div>
          
          {/* Required CSS for 3D flip effect */}
          <style dangerouslySetInnerHTML={{__html: `
            .perspective-1000 { perspective: 1000px; }
            .transform-style-3d { transform-style: preserve-3d; }
            .backface-hidden { backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); }
          `}} />
        </div>
      );
    };

    const CaseVignettes = () => {
      const [topic, setTopic] = useState('Salivary Gland Tumors');
      const [loading, setLoading] = useState(false);
      const [caseData, setCaseData] = useState(null);
      const [userGuess, setUserGuess] = useState('');
      const [showAnswer, setShowAnswer] = useState(false);

      const topics = [
        "Oral Cavity Squamous Cell Carcinoma",
        "Salivary Gland Tumors",
        "Tuberculosis",
        "Deep Fungal Infections (e.g., Mucormycosis, Aspergillus)",
        "Syphilis",
        "Viral Infections (CMV, HSV, HPV)"
      ];

      const handleGenerateCase = async () => {
        setLoading(true);
        setShowAnswer(false);
        setUserGuess('');
        setCaseData(null);
        
        const prompt = `Act as an expert Pathology attending physician. Create a detailed, USMLE-style clinical case vignette focusing on a specific pathology related to: ${topic}. 
        Include patient demographics, history, physical exam findings, and key biopsy/microscopic features. 
        Do not explicitly state the diagnosis in the vignette text.`;

        const schema = {
          type: "OBJECT",
          properties: {
            vignette: { type: "STRING", description: "The clinical case description" },
            diagnosis: { type: "STRING", description: "The exact pathological diagnosis" },
            explanation: { type: "STRING", description: "Why this diagnosis is correct and key features to recognize" }
          },
          required: ["vignette", "diagnosis", "explanation"]
        };

        const data = await generateContentFromGemini(prompt, schema);
        if (data) {
          setCaseData(data);
        } else {
          alert("Failed to generate case. Please try again.");
        }
        setLoading(false);
      };

      return (
        <div className="flex flex-col md:flex-row h-full overflow-hidden bg-slate-50">
          <div className="w-full md:w-80 bg-white border-r border-slate-200 p-6 flex flex-col">
            <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center">
              <Stethoscope className="w-6 h-6 mr-2 text-teal-600" /> Clinic Setup
            </h2>
            
            <label className="text-sm font-semibold text-slate-600 mb-2 block">Select Pathology Topic</label>
            <div className="space-y-2 mb-6 flex-1 overflow-y-auto pr-2">
              {topics.map(t => (
                <button
                  key={t}
                  onClick={() => setTopic(t)}
                  className={`w-full text-left p-3 text-sm rounded-lg transition-colors border ${topic === t ? 'bg-teal-50 border-teal-500 text-teal-800 font-medium' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                >
                  {t}
                </button>
              ))}
            </div>

            <button 
              onClick={handleGenerateCase}
              disabled={loading}
              className="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-all shadow-md flex justify-center items-center"
            >
              {loading ? <RefreshCw className="animate-spin w-5 h-5" /> : "Generate New Case"}
            </button>
          </div>
          
          <div className="flex-1 overflow-y-auto p-6 md:p-10">
            {!caseData && !loading && (
              <div className="h-full flex flex-col items-center justify-center text-center opacity-50">
                <Stethoscope className="w-24 h-24 text-slate-300 mb-4" />
                <h3 className="text-2xl font-bold text-slate-500">Awaiting Patient...</h3>
                <p className="text-slate-400 mt-2">Generate a case from the sidebar to begin.</p>
              </div>
            )}

            {loading && (
              <div className="h-full flex flex-col items-center justify-center">
                 <div className="w-16 h-16 border-4 border-teal-200 border-t-teal-600 rounded-full animate-spin"></div>
                 <p className="mt-4 text-teal-700 font-medium animate-pulse">Consulting Gemini for clinical records...</p>
              </div>
            )}

            {caseData && !loading && (
              <div className="max-w-3xl mx-auto animate-in fade-in zoom-in-95 duration-300">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                  <div className="bg-slate-800 p-4 text-white flex items-center">
                    <Activity className="w-5 h-5 mr-2 text-teal-400" />
                    <h3 className="font-bold tracking-wide">CLINICAL VIGNETTE</h3>
                  </div>
                  <div className="p-6 md:p-8">
                    <p className="text-slate-700 text-lg leading-relaxed whitespace-pre-line">
                      {caseData.vignette}
                    </p>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h4 className="font-bold text-slate-700 mb-3">Your Diagnosis:</h4>
                  <div className="flex space-x-3">
                    <input 
                      type="text" 
                      value={userGuess}
                      onChange={(e) => setUserGuess(e.target.value)}
                      disabled={showAnswer}
                      placeholder="Type your pathological diagnosis here..."
                      className="flex-1 p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none disabled:bg-slate-100"
                    />
                    {!showAnswer ? (
                      <button 
                        onClick={() => setShowAnswer(true)}
                        className="px-6 py-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition-colors"
                      >
                        Submit
                      </button>
                    ) : (
                      <button 
                        onClick={handleGenerateCase}
                        className="px-6 py-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition-colors"
                      >
                        Next Case
                      </button>
                    )}
                  </div>

                  {showAnswer && (
                    <div className="mt-6 p-6 bg-teal-50 border border-teal-200 rounded-xl animate-in slide-in-from-top-4 duration-300">
                      <h4 className="text-sm font-bold text-teal-600 uppercase tracking-wide">Correct Diagnosis</h4>
                      <p className="text-2xl font-black text-slate-800 mt-1">{caseData.diagnosis}</p>
                      
                      <h4 className="text-sm font-bold text-teal-600 uppercase tracking-wide mt-6">Explanation & Key Features</h4>
                      <p className="text-slate-700 mt-1 leading-relaxed">{caseData.explanation}</p>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- Main App Component ---
    function PathologyApp() {
      const [activeTab, setActiveTab] = useState('study');

      const tabs = [
        { id: 'study', label: 'Study Materials', icon: <BookOpen className="w-5 h-5 mr-2" /> },
        { id: 'quiz', label: 'Test Your Knowledge', icon: <HelpCircle className="w-5 h-5 mr-2" /> },
        { id: 'flashcards', label: 'Practical ID', icon: <Layers className="w-5 h-5 mr-2" /> },
        { id: 'cases', label: 'Case Vignettes', icon: <Activity className="w-5 h-5 mr-2" /> },
      ];

      return (
        <div className="h-screen w-full bg-slate-100 flex flex-col font-sans overflow-hidden">
          {/* Top Navigation Bar */}
          <header className="bg-slate-900 text-white shadow-md z-10 flex-shrink-0">
            <div className="max-w-7xl mx-auto px-4">
              <div className="flex flex-col md:flex-row md:items-center justify-between py-4">
                <div className="flex items-center space-x-3 mb-4 md:mb-0">
                  <div className="bg-teal-500 p-2 rounded-lg">
                    <BrainCircuit className="w-6 h-6 text-white" />
                  </div>
                  <h1 className="text-2xl font-bold tracking-tight text-white">Patho<span className="text-teal-400">Review</span></h1>
                </div>
                
                <nav className="flex space-x-1 overflow-x-auto pb-2 md:pb-0 hide-scrollbar">
                  {tabs.map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center px-4 py-2.5 rounded-lg font-medium transition-all whitespace-nowrap ${
                        activeTab === tab.id 
                          ? 'bg-teal-600 text-white shadow-inner' 
                          : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                      }`}
                    >
                      {tab.icon}
                      {tab.label}
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 overflow-hidden relative">
            {activeTab === 'study' && <StudyMaterials />}
            {activeTab === 'quiz' && <QuizApp />}
            {activeTab === 'flashcards' && <FlashcardSimulator />}
            {activeTab === 'cases' && <CaseVignettes />}
          </main>
          
          {/* Global utility for hiding scrollbar visually but keeping function */}
          <style dangerouslySetInnerHTML={{__html: `
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
          `}} />
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PathologyApp />);
  </script>
</body>
</html>
